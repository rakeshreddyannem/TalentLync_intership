<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Form</title>

    <style>
      body {
        margin: 8px;
        font-family: "Times New Roman", serif;
        font-size: 16px;
      }

      h1 {
        font-size: 32px;
        margin: 0 0 20px 0;
        font-weight: bold;
      }

      .form-group {
        margin-bottom: 2px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"] {
        height: 18px;
        padding: 1px 4px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        box-sizing: border-box;
      }

      input[type="text"] {
        width: 168px;
      }

      input[type="email"] {
        width: 168px;
      }

      input[type="password"] {
        width: 175px;
      }

      input[type="tel"] {
        width: 215px;
      }

      input[type="date"] {
        width: 118px;
        height: 22px;
        font-size: 13px;
      }

      select {
        height: 22px;
        font-size: 13px;
      }

      input[type="radio"],
      input[type="checkbox"] {
        margin: 0 3px 0 0;
        vertical-align: middle;
      }

      input[type="file"] {
        font-size: 13px;
      }

      button {
        font-family: "Times New Roman", serif;
        font-size: 16px;
        padding: 1px 6px;
        margin-right: 2px;
      }

      #dynamicFields {
        margin-top: 2px;
        margin-bottom: 2px;
      }
    </style>
  </head>

  <body>
    <h1>Student Registration Form</h1>

    <form action="" method="post" id="studentForm">
      <div>
        Name:
        <input
          type="text"
          name="name"
          id="name"
          placeholder="Enter your name"
          required
        />
      </div>

      <div>
        Email:
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div>
        Password:
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter your password"
          minlength="8"
          required
        />
      </div>

      <div>
        Roll No:
        <input
          type="text"
          name="roll_no"
          id="roll_no"
          placeholder="Enter your Roll No"
          required
        />
      </div>

      <div>
        Phone Number:
        <input
          type="tel"
          name="phone_no"
          id="phone_no"
          placeholder="Enter your phone number"
          minlength="10"
          maxlength="10"
          required
        />
      </div>

      <div>
        Date of Birth:
        <input type="date" name="dob" id="dob" required />
      </div>

      <div>
        Gender:
        <input type="radio" name="gender" id="male" value="Male" required />Male

        <input type="radio" name="gender" id="female" value="Female" />Female
      </div>

      <div>
        Branch:
        <select name="departments" id="departments" required>
          <option value="" disabled selected>Select your department</option>
          <option value="EEE">EEE</option>
          <option value="ECE">ECE</option>
          <option value="ME">ME</option>
          <option value="CE">CE</option>
          <option value="CSE">CSE</option>
        </select>
      </div>

      <!-- Dynamic fields will appear here -->
      <div id="dynamicFields"></div>

      <div>
        Skills:
        <input type="checkbox" name="skills" id="cpp" value="C++" />
        C++

        <input type="checkbox" name="skills" id="python" value="Python" />
        Python

        <input type="checkbox" name="skills" id="java" value="Java" />
        Java

        <input type="checkbox" name="skills" id="c" value="C" />
        C

        <input
          type="checkbox"
          name="skills"
          id="javascript"
          value="Javascript"
        />
        Javascript

        <input type="checkbox" name="skills" id="go" value="Go" />
        Go
      </div>

      <div>
        Resume:
        <input type="file" name="resume" id="resume" accept=".pdf" required />
      </div>

      <div>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </div>
    </form>

    <script>
      const department = document.getElementById("departments");
      const dynamicFields = document.getElementById("dynamicFields");

      department.addEventListener("change", function () {
        // Remove previous dynamic fields
        dynamicFields.innerHTML = "";

        // CSE
        if (this.value === "CSE") {
          dynamicFields.innerHTML = `
          <div>
            Programming Language:
            <select name="programming_language" required>
              <option value="" disabled selected>
                Select language
              </option>
              <option value="C++">C++</option>
              <option value="Python">Python</option>
              <option value="Java">Java</option>
              <option value="JavaScript">JavaScript</option>
            </select>
          </div>

          <div>
            Number of Projects:
            <input
              type="number"
              name="projects"
              min="0"
              placeholder="Enter number"
            />
          </div>
        `;
        }

        // ECE
        else if (this.value === "ECE") {
          dynamicFields.innerHTML = `
          <div>
            Specialization:
            <select name="specialization" required>
              <option value="" disabled selected>
                Select specialization
              </option>
              <option value="VLSI">VLSI</option>
              <option value="Embedded Systems">
                Embedded Systems
              </option>
              <option value="Communication">
                Communication
              </option>
            </select>
          </div>

          <div>
            Internship:
            <input
              type="text"
              name="internship"
              placeholder="Enter internship"
            />
          </div>
        `;
        }

        // EEE
        else if (this.value === "EEE") {
          dynamicFields.innerHTML = `
          <div>
            Area of Interest:
            <select name="interest">
              <option value="" disabled selected>
                Select area
              </option>
              <option value="Power Systems">
                Power Systems
              </option>
              <option value="Control Systems">
                Control Systems
              </option>
              <option value="Electrical Machines">
                Electrical Machines
              </option>
            </select>
          </div>
        `;
        }

        // Mechanical
        else if (this.value === "ME") {
          dynamicFields.innerHTML = `
          <div>
            Specialization:
            <select name="specialization">
              <option value="" disabled selected>
                Select specialization
              </option>
              <option value="Automobile">Automobile</option>
              <option value="Manufacturing">
                Manufacturing
              </option>
              <option value="Thermal">Thermal</option>
            </select>
          </div>
        `;
        }

        // Civil
        else if (this.value === "CE") {
          dynamicFields.innerHTML = `
          <div>
            Area of Interest:
            <select name="interest">
              <option value="" disabled selected>
                Select area
              </option>
              <option value="Structural">
                Structural Engineering
              </option>
              <option value="Construction">
                Construction
              </option>
              <option value="Transportation">
                Transportation
              </option>
            </select>
          </div>
        `;
        }
      });

      // Reset dynamic fields
      document
        .getElementById("studentForm")
        .addEventListener("reset", function () {
          setTimeout(function () {
            dynamicFields.innerHTML = "";
          }, 0);
        });

      // Submit
      document
        .getElementById("studentForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          alert("Registration submitted successfully!");
        });
    </script>
  </body>
</html>
