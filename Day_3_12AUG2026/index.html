      <aside>

          <li><a href="index.html">Home</a></li>
          <li><a href="packages.html">Packages</a></li>

      </aside>
    </div>

    <div>
      <main>
        <section>
          <img src="pic.jpg" alt="Banner image" />
        </section>

        <section>
          <h1>AI Tools & Solutions</h1>
          <p>Explore powerful AI tools for your daily needs.</p>
        </section>

        <section>
          <h2>Subscribe with us</h2>
          <form
            action="https://platinitee.com/talentlync/form.php"
            method="post"
          >
            <div>
              <label for="username">User Name: </label>
              <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter your name"
                minlength="3"
                maxlength="40"
                required
              />
            </div>

            <div>
              <label for="email">Email: </label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div>
              <label for="age">Age: </label>
              <input
                type="number"
                name="age"
                id="age"
                placeholder="Enter your age"
                min="18"
                max="25"
                required
              />
            </div>

            <div>
              <label for="dob">Date of Birth: </label>
              <input type="date" name="dob" id="dob" required />
            </div>
            <div>
              <label for="requirements">Requirements:</label>
              <textarea
                name="requirements"
                id="requirements"
                required
              ></textarea>
            </div>
            <div>
              <button type="submit">Subscribe</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <div>
      <footer>
        <p>&copy; 2026 AI Tools & Solutions. All rights reserved.</p>
      </footer>
    </div>
