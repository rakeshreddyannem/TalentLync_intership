    <main>
      <h1>Contact Us</h1>
      <form action="https://platinitee.com/talentlync/form.php" method="post">
        <div>
          <label for="username">User Name: </label>
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Enter your name"
            minlength="3"
            maxlength="40"
            required
          />
        </div>

        <div>
          <label for="email">Email: </label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div>
          <label for="age">Age: </label>
          <input
            type="number"
            name="age"
            id="age"
            placeholder="Enter your age"
            min="18"
            max="25"
            required
          />
        </div>

        <div>
          <label for="dob">Date of Birth: </label>
          <input type="date" name="dob" id="dob" required max="" />
        </div>
        <div>
          <label for="requirements">Requirements:</label>
          <textarea
            name="requirements"
            id="requirements"
            rows="5"
            required
          ></textarea>
        </div>
        <div>
          <button type="submit">Submit</button>
        </div>
      </form>
    </main>
